[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excelpilot"
version = "0.1.0"
description = "Controlled AI Excel operations engine: inspect, plan, decide, authorize, execute, verify, audit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ExcelPilot contributors" }]
keywords = ["excel", "xlsx", "automation", "operations", "audit", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# Deliberately small. See docs/adr/0002-minimal-dependencies.md
dependencies = [
    "openpyxl>=3.1.5",      # deterministic workbook engine (ADR-0001)
    "pydantic>=2.7",        # typed contracts + validation of untrusted model output
    "typer>=0.12",          # CLI
    "rich>=13.7",           # CLI output
    "defusedxml>=0.7.1",    # hardened XML parsing for untrusted workbook parts
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]
recalc = [
    # Recalculation is OPTIONAL and unproven on this runtime. See docs/limitations.md.
    "pycel>=1.0b30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[project.scripts]
excelpilot = "app.cli.main:main"

[project.urls]
Homepage = "https://github.com/excelpilot/excelpilot"
Issues = "https://github.com/excelpilot/excelpilot/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not slow and not benchmark and not live'"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "security: security boundary tests",
    "e2e: end-to-end scenario tests",
    "slow: long-running tests against very large real workbooks (opt in with -m slow)",
    "benchmark: benchmark suite (excluded by default)",
    "live: requires real paid external services (excluded by default)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv", "build", "dist", "dashboard/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "TID"]
ignore = [
    "E501",    # line length handled by formatter
    "SIM108",  # ternary is not always clearer
    "RET504",  # named return before return reads better in typed code
    # `str, Enum` is deliberate: it makes JSON audit records readable
    # ("risk": "high") and stable across Python versions. See contracts/enums.py.
    "UP042",
    # Exception names read as sentences at the raise site (`raise PolicyDenied(...)`),
    # which is clearer than `PolicyDeniedError`. These names are part of the
    # documented API; see contracts/errors.py.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802"]
"app/cli/*" = ["T201"]  # CLI legitimately prints
# The redirect handler's signature is fixed by urllib's HTTPRedirectHandler; the
# unused parameters are part of the contract, not an oversight.
"app/net/http.py" = ["ARG002"]
# JevAdapter.decide(context) and build_questions(context) both take the context so
# every adapter and question builder has the same shape. The mock adapter and the
# question builder do not need to read it.
"app/decisions/*" = ["ARG001", "ARG002"]
# Every operation handler takes (workbook, operation, context) so the registry can
# call them uniformly. Not every handler needs the context today; that is fine and
# the signature stays stable as operations are added.
"app/executor/operations.py" = ["ARG001"]
# Policy rules share one (request, thresholds) signature so the Rule dataclass can
# invoke them uniformly. Some rules do not read every threshold.
"app/policy/rules.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pycel.*"]
ignore_missing_imports = true
